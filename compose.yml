services:
  postgres:
    image: ghcr.io/railwayapp-templates/postgres-ssl:18
    environment:
      POSTGRES_USER: newapi
      POSTGRES_DB: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$POSTGRES_PASSWORD" psql "host=127.0.0.1 dbname=$$POSTGRES_DB user=$$POSTGRES_USER sslmode=require" -Atqc "SELECT 1"']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.2.11
    entrypoint: [/bin/sh, -ec, 'exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 3s
      timeout: 3s
      retries: 30
  newapi:
    image: calciumion/new-api:v1.0.0-rc.51
    environment:
      PORT: 3000
      SQL_DSN: postgresql://newapi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/newapi?sslmode=require
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    ports:
      - '127.0.0.1:${NEW_API_LOCAL_PORT:-3000}:3000'
    volumes:
      - newapi-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/status']
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  redis-data:
  newapi-data:
